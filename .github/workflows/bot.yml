name: Auto Deal Bot

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          ${{ env.pythonLocation }}/bin/python -m pip install --upgrade pip
          ${{ env.pythonLocation }}/bin/python -m pip install -r requirements.txt

      - name: Run Telegram Deal Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: ${{ env.pythonLocation }}/bin/python bot.py

      - name: Save posted_deals.db state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_deals.db
          git diff --staged --quiet || git commit -m "chore: update posted deals history"
          git push
